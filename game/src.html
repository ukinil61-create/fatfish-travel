<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大肥鱼的旅行</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* One phone-sized game frame: header, scene panel, controls, fixed bottom tab bar. Single committed seaside look (light only, painted art). */
:root{
  --navy:#1f3468; --ink:#1c2442; --foam:#e6f4f3; --glass:#a9dbd6;
  --paper:#fbfdff; --sand:#f1ddb7; --coral:#ee8691; --gold:#e4b04a;
  --muted:#5e6b86; --line:#cfe0e6;
  --display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#cfeceb 0%,#e9f6f5 40%,#f3f8fb 100%);background-color:var(--foam);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(84px + env(safe-area-inset-bottom,0px));gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:25px;margin:0;color:var(--navy);letter-spacing:.04em;line-height:1.1;white-space:nowrap}
h1 small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.18em;color:var(--muted);margin-top:3px}
.hud{display:flex;gap:6px;align-items:center}
.coins{display:flex;align-items:center;gap:4px;background:var(--paper);border:1.5px solid var(--navy);border-radius:999px;padding:3px 10px 3px 5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}
.coins svg{width:22px;height:22px}
.pill{font:500 12px var(--body);background:transparent;border:1.5px dashed var(--muted);color:var(--muted);border-radius:999px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.pill.on{border-style:solid;border-color:var(--coral);color:#b8505c;background:#fff0f1}
button:focus-visible,[role=button]:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
button{font-family:inherit}

.panel{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--navy);box-shadow:0 6px 0 var(--navy);aspect-ratio:3/2;max-width:100%;background:#cfe6ea center/cover no-repeat}
.caption{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-height:22px}
.caption b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--navy)}
.caption span{font-size:13px;color:var(--muted);text-align:right}
.sec-title{font-family:var(--display);font-size:19px;color:var(--navy);margin:4px 0 0;font-weight:400}
.tip{font-size:13px;color:var(--muted);margin:0}
#view{display:flex;flex-direction:column;gap:12px}

/* beach */
.shimmer{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0 30%,rgba(255,255,255,.35) 36%,transparent 42%);background-size:300% 100%;animation:shim 7s linear infinite;mix-blend-mode:soft-light}
@keyframes shim{from{background-position:120% 0}to{background-position:-60% 0}}
.spot{position:absolute;width:10.5%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;cursor:pointer}
.spot svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(31,52,104,.22));animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.spot:hover svg{transform:rotate(-8deg) scale(1.06)}
.spot.empty{pointer-events:none}
.spot[data-s=g] svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1),glint 1.8s ease-in-out infinite .5s}
@keyframes glint{0%,100%{filter:drop-shadow(0 3px 0 rgba(31,52,104,.22))}50%{filter:drop-shadow(0 0 7px #fff3b0) drop-shadow(0 3px 0 rgba(31,52,104,.22))}}
@keyframes pop{from{transform:scale(.2) translateY(20%);opacity:0}to{transform:none;opacity:1}}
.float{position:absolute;font:700 17px var(--body);color:var(--navy);pointer-events:none;animation:up .9s ease-out forwards;transform:translate(-50%,-50%);text-shadow:0 0 4px #fff,0 0 2px #fff}
@keyframes up{to{transform:translate(-50%,-170%);opacity:0}}
.mat{position:absolute;left:4%;top:68%;width:30%;border:0;background:transparent;padding:0;cursor:pointer}
.mat svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 0 rgba(31,52,104,.2))}
.mat .lbl{position:absolute;left:50%;top:-12%;transform:translateX(-50%);background:#fff;border:1.5px solid var(--navy);border-radius:999px;font:12px var(--display);color:var(--navy);padding:0 8px;white-space:nowrap}
.guest{position:absolute;left:30%;top:60%;width:17%;border:0;background:transparent;padding:0;cursor:pointer;transform:translate(-50%,0);animation:hop 1.6s ease-in-out infinite}
.guest img{width:100%;display:block;filter:drop-shadow(0 3px 0 rgba(31,52,104,.2))}
.guest .ex{position:absolute;right:-8%;top:-14%;background:var(--coral);color:#fff;border:1.5px solid var(--navy);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font:700 13px var(--body)}
@keyframes hop{0%,100%{translate:0 0}50%{translate:0 -6%}}

/* room */
.room .night{position:absolute;inset:0;background:radial-gradient(40% 50% at 3% 14%,rgba(255,200,120,.35),transparent 70%),radial-gradient(30% 40% at 97% 14%,rgba(255,200,120,.3),transparent 70%),rgba(34,40,108,.62);mix-blend-mode:multiply;pointer-events:none;transition:opacity 1s}
.room .glow{position:absolute;inset:0;background:radial-gradient(18% 26% at 3% 14%,rgba(255,214,150,.55),transparent 70%),radial-gradient(14% 22% at 97% 14%,rgba(255,214,150,.5),transparent 70%);mix-blend-mode:screen;pointer-events:none}
.fish{position:absolute;transform-origin:50% 100%;cursor:pointer;transition:opacity .8s}
.fish img{height:100%;width:auto;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.fish .breath{height:100%;transform-origin:50% 100%;animation:breath 3.4s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}
.fish.hop .breath{animation:hopb .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hopb{0%{transform:scale(1.05,.92)}40%{transform:translateY(-8%) scale(.97,1.04)}100%{transform:none}}
.fish.wave .breath{animation:sway 1.1s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.fish.walk{transition:left 2.7s linear,top 2.7s linear,height 2.7s linear,opacity .8s 2.1s}
.fish.walk .breath{animation:stepbob .42s ease-in-out infinite}
@keyframes stepbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
.shadow{position:absolute;height:5%;border-radius:50%;background:radial-gradient(closest-side,rgba(60,40,30,.35),transparent);transform:translate(-50%,-50%);pointer-events:none;transition:opacity .8s}
.note{position:absolute;left:50%;top:62%;width:16%;aspect-ratio:1.2;background:#fffdf3;border:1.5px solid var(--navy);transform:rotate(-6deg);font:11px var(--display);color:var(--navy);display:grid;place-items:center;text-align:center;line-height:1.3;padding:3px;box-shadow:0 3px 0 rgba(31,52,104,.2)}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--navy);border-radius:16px;padding:5px 11px;font-size:13px;max-width:62%;width:max-content;text-align:center;animation:pop .3s ease-out;z-index:3}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:translateX(-50%) rotate(45deg)}
.mailbox{position:absolute;left:3%;bottom:6%;border:2px solid var(--navy);background:var(--coral);color:#fff;font:14px var(--display);border-radius:12px;padding:5px 10px;cursor:pointer;box-shadow:0 3px 0 var(--navy);animation:pop .4s,nudge 2.4s ease-in-out infinite 1s;z-index:4}
@keyframes nudge{0%,90%,100%{transform:none}93%{transform:rotate(-6deg)}96%{transform:rotate(6deg)}}
.mailbox[hidden]{display:none}

.bag{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{background:var(--paper);border:2px dashed var(--muted);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:104px;justify-content:center;font:inherit;color:inherit}
.slot.filled{border-style:solid;border-color:var(--navy);box-shadow:0 3px 0 var(--navy)}
.slot .lbl{font-size:11px;letter-spacing:.2em;color:var(--muted)}
.slot .nm{font-size:13px;font-weight:500;text-align:center}
.slot:disabled{cursor:default;opacity:.85}
.seal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:22px var(--display);color:#fff;border:2px solid var(--navy);flex:none}
.seal.ghost{background:transparent;border-style:dashed;border-color:var(--muted);color:var(--muted)}

/* shop */
.shop{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.item .t{font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.item .t em{font-style:normal;font-weight:400;font-size:12px;color:var(--muted)}
.item p{margin:2px 0 0;font-size:13px;color:var(--muted);min-width:0}
.buy{font:700 14px var(--body);background:var(--navy);color:#fff;border:0;border-radius:12px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.buy svg{width:16px;height:16px}
.buy:disabled{background:#c5cdd9;cursor:not-allowed}
.cat{font:12px var(--body);letter-spacing:.24em;color:var(--muted);margin:8px 2px 0}
.lotto{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;background:linear-gradient(160deg,#fff6e8,#ffe9ec);border:2px solid var(--navy);border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--navy)}
.lotto h3{font:400 20px var(--display);color:var(--navy);margin:0}
.lotto p{margin:2px 0 8px;font-size:13px;color:var(--muted)}
.drum{width:120px;height:110px;position:relative}
.drum .wheel{position:absolute;left:18px;top:0;width:84px;height:84px;transition:transform 1.5s cubic-bezier(.3,.1,.2,1)}
.drum .ball{position:absolute;left:94px;top:70px;width:18px;height:18px;border-radius:50%;border:2px solid var(--navy);opacity:0}
.drum .ball.out{animation:drop .6s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes drop{0%{opacity:1;transform:translate(-30px,-26px) scale(.6)}100%{opacity:1;transform:none}}

/* album */
.album{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card-thumb{border:0;padding:6px;background:#fff;box-shadow:0 2px 0 var(--line),0 6px 14px rgba(31,52,104,.12);cursor:pointer;border-radius:4px;transform:rotate(var(--r,0deg));position:relative}
.card-thumb img{display:block;width:100%;aspect-ratio:3/2;background:#eef3f6}
.card-thumb .new{position:absolute;top:-6px;right:-6px;background:var(--coral);color:#fff;font:11px var(--display);padding:1px 7px;border-radius:999px}
.card-thumb .fr{position:absolute;left:-6px;bottom:-6px;width:28px;height:26px;background:#fff;border:1.5px solid var(--navy);border-radius:50%;padding:2px}
.card-thumb .fr img{width:100%;height:100%;aspect-ratio:auto;background:none}
.empty-state{background:var(--paper);border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted);font-size:14px}

/* treasures */
.dest-row{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:8px 10px;display:grid;grid-template-columns:80px repeat(3,1fr);gap:6px;align-items:center}
.dest-row .dn{font:15px var(--display);color:var(--navy);line-height:1.2}
.dest-row .dn small{display:block;font:11px var(--body);color:var(--muted)}
.tr{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
.tr svg{width:42px;height:42px}
.tr b{font-size:11px;font-weight:500;line-height:1.25}
.tr span{font-size:10px;color:var(--muted)}
.tr.locked svg{filter:grayscale(1) brightness(1.5);opacity:.5}
.tr.locked b{color:#a3adbf}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1 1 22%;background:var(--paper);border-radius:14px;padding:6px 10px;border:1.5px solid var(--line)}
.stat b{display:block;font:21px var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.friends{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.friend{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:8px 6px;text-align:center}
.friend img{width:62px;height:57px;display:block;margin:0 auto}
.friend b{font:15px var(--display);color:var(--navy);display:block}
.friend span{font-size:11px;color:var(--muted);display:block;line-height:1.35}
.friend.unknown img{filter:brightness(0) opacity(.18)}
.hearts{color:var(--coral);letter-spacing:1px;font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--navy);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:20}
nav .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav button{border:0;background:transparent;font:13px var(--display);color:var(--muted);padding:6px 0 4px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button svg{width:24px;height:24px}
nav button[aria-selected="true"]{color:var(--navy);background:var(--foam)}
nav .dot{position:absolute;top:3px;right:22%;width:9px;height:9px;border-radius:50%;background:var(--coral);border:1.5px solid #fff}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(18,30,60,.55);display:grid;place-items:center;z-index:40;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--paper);border:2px solid var(--navy);border-radius:22px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:pop .3s ease-out}
.sheet h3{font:400 21px var(--display);color:var(--navy);margin:0}
.flip{perspective:1200px;cursor:pointer}
.flip .inner{position:relative;transition:transform .7s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;transform:rotate(-1.2deg)}
.flip.back .inner{transform:rotateY(180deg) rotate(1.2deg)}
.face{background:#fff;padding:7px;box-shadow:0 6px 18px rgba(0,0,0,.18);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face img{display:block;width:100%;height:auto;aspect-ratio:3/2;background:#eef3f6}
.face.rear{position:absolute;inset:0;transform:rotateY(180deg);background:#fffdf6;display:grid;grid-template-columns:1.25fr 1fr;gap:10px;padding:14px}
.rear .msg{font:15px/26px var(--display);color:var(--navy);background:repeating-linear-gradient(180deg,transparent 0 25px,#e6dccb 25px 26px);overflow:hidden;padding-top:1px}
.rear .sign{display:block;text-align:right}
.rear .side{border-left:1.5px dashed #d9cdb6;padding-left:10px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
.stamp{width:62px;height:74px;background:#fff;border:2px dashed #c9b99e;padding:3px;display:grid;place-items:center;transform:rotate(3deg)}
.stamp svg{width:46px;height:46px}
.rear .addr{font:13px var(--display);color:var(--muted);text-align:right;line-height:1.8;width:100%;border-bottom:1px solid #e6dccb}
.fliphint{font-size:12px;color:var(--muted);text-align:center;margin:-4px 0 0}
.letter{font:16px var(--display);color:var(--navy);line-height:1.7;margin:0;padding:6px 4px;background:repeating-linear-gradient(180deg,transparent 0 26px,var(--line) 26px 27px)}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{font:700 14px var(--body);border-radius:12px;padding:9px 16px;cursor:pointer;border:2px solid var(--navy);background:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:var(--navy)}
.pick{display:flex;flex-direction:column;gap:8px}
.pick button{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer;font:inherit;color:inherit}
.pick button small{display:block;color:var(--muted);font-size:12px}
.gift{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:12px;border:1.5px solid var(--line)}
.gift svg,.gift img{width:64px;height:64px;flex:none}
.hero{display:flex;justify-content:center}
.hero img{height:190px;width:auto;filter:drop-shadow(0 6px 0 rgba(31,52,104,.12))}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;z-index:50;animation:pop .3s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>大肥鱼的旅行<small>WHALE MAID · TRAVEL DIARY</small></h1>
    <div class="hud">
      <button class="pill" id="sound" title="音乐与音效">♪ 关</button>
      <button class="pill" id="speed" title="切换时间流速">×1</button>
      <div class="coins" aria-label="贝壳数"><span id="coinIcon"></span><span id="coins">0</span></div>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav><div class="in" role="tablist" id="tabs"></div></nav>
<div id="modalRoot"></div>

<script>
/* ---------- assets (filled in by build.py) ---------- */
const IMG_SRC={
 bg_room:"__IMG_bg_room__",bg_beach:"__IMG_bg_beach__",bg_beach_star:"__IMG_bg_beach_star__",bg_lighthouse:"__IMG_bg_lighthouse__",
 bg_shrine:"__IMG_bg_shrine__",bg_coral:"__IMG_bg_coral__",bg_forest:"__IMG_bg_forest__",bg_onsen:"__IMG_bg_onsen__",
 bg_station:"__IMG_bg_station__",bg_library:"__IMG_bg_library__",bg_fjord:"__IMG_bg_fjord__",
 fish_read:"__IMG_fish_read__",fish_sleep:"__IMG_fish_sleep__",fish_eat:"__IMG_fish_eat__",fish_sew:"__IMG_fish_sew__",
 fish_write:"__IMG_fish_write__",fish_clean:"__IMG_fish_clean__",fish_pack:"__IMG_fish_pack__",fish_back:"__IMG_fish_back__",fish_look:"__IMG_fish_look__"};
const POSE=__POSE_META__;
const BGM="__BGM__";
/*__FRIENDS__*/
/*__SOUV__*/
const IMG={};
const imgReady=Promise.all(Object.entries(IMG_SRC).map(([k,src])=>new Promise(r=>{const im=new Image();im.onload=im.onerror=()=>r();im.src=src;IMG[k]=im})));
const FR_URL=Object.fromEntries(Object.entries(FR_SVG).map(([k,s])=>[k,'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)]));
const FR_IMG={};
const frReady=Promise.all(Object.entries(FR_URL).map(([k,u])=>new Promise(r=>{const im=new Image();im.onload=im.onerror=()=>r();im.src=u;FR_IMG[k]=im})));

/* ---------- data ---------- */
const NAME='大肥鱼';
const ITEMS={
  onigiri:{cat:'food',name:'海苔饭团',price:10,tier:1,glyph:'团',color:'#5b8f6a',desc:'朴素的饭团，适合在附近散步。'},
  bento:{cat:'food',name:'鱼糕便当',price:25,tier:2,glyph:'糕',color:'#e08a7c',desc:'粉白相间的鱼糕，能走得更远一点。'},
  tea:{cat:'food',name:'珍珠奶茶',price:45,tier:3,glyph:'茶',color:'#a7774f',desc:'喝完会有力气爬上雪山。'},
  pudding:{cat:'food',name:'星星布丁',price:90,tier:4,glyph:'星',color:'#d9a83a',desc:'传说吃了会听见鲸鱼的歌。'},
  amulet:{cat:'charm',name:'贝壳护身符',price:20,glyph:'贝',color:'#6aa9c9',desc:'运气变好，偶尔多带回一件纪念品。'},

  if(fx==='snow'){for(let i=0;i<(front?40:110);i++){const x=R()*W,y=R()*H,r=front?3+R()*5:1.2+R()*2.6;ctx.fillStyle=`rgba(255,255,255,${front?.85:.9})`;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
    if(!front){for(let i=0;i<5;i++)glow(ctx,W*.55+R()*W*.4,H*.55+R()*H*.25,90+R()*60,'rgba(255,255,255,.35)')}}
  if(fx==='pages'){for(let i=0;i<(front?6:14);i++){const x=R()*W,y=R()*H*.7,s=front?16:8;ctx.save();ctx.translate(x,y);ctx.rotate((R()-.5)*.8);ctx.fillStyle='#fffaf0';ctx.strokeStyle='#8a7fb0';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-s*2,-s);ctx.lineTo(-s*2,s*.2);ctx.closePath();ctx.moveTo(0,0);ctx.lineTo(s*2,-s);ctx.lineTo(s*2,s*.2);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}

const cardCache=new Map();

  const key=card.dest+':'+card.seed+':'+(card.friend||'')+':'+(card.pose||'');if(cardCache.has(key))return cardCache.get(key);

  const fx_=mx(d.place.x[0]+R()*(d.place.x[1]-d.place.x[0])),fy=my(d.place.y[0]+R()*(d.place.y[1]-d.place.y[0]));

    const side=(cx>CW*.55?-1:1);let fxp=cx+side*(ww*.45+fw*.55);fxp=Math.max(fw*.6,Math.min(CW-fw*.6,fxp));
    frDraw=()=>{ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgba(40,30,60,.3)';ctx.beginPath();ctx.ellipse(fxp,fy,fw*.4,fh*.07,0,0,7);ctx.fill();ctx.restore();
      const sp=litSprite(fi,fw,fh,{...d.light,rimA:d.light.rimA*.6},side<0);ctx.drawImage(sp,fxp-fw/2,fy-fh*.97)}}
  const ucol=R()<.5?'#ee8691':'#7c9adf',ux=cx+(flip?-1:1)*ww*.03,uy=top+hh*.1,uw=Math.min(ww*1.3,hh*1.05);

/* ---------- game logic ---------- */
function rollShell(){const r=Math.random();return r<.03?'g':r<.15?'p':'n'}
const SHELL_VAL={n:1,p:5,g:20};
function chooseDest(bag){
  const food=ITEMS[bag.food].tier,keys=[bag.tool,bag.charm].filter(Boolean);
  if(bag.charm==='amulet'&&Math.random()<.06)return 'fjord';
  const el=DESTS.filter(d=>d.tier<=food&&(!d.req||keys.includes(d.req)));
  const ws=el.map(d=>{let w=1;if(d.req&&keys.includes(d.req))w=7;else if(d.tier===food)w=3;if(!S.souv[d.id+':0'])w*=1.6;return w});
  return el[wpick(ws)].id;
}
const DUR=[[150,240],[210,360],[300,480],[420,660]];
function dateStr(){const d=new Date();return `${String(d.getFullYear()).slice(2)}.${d.getMonth()+1}.${d.getDate()}`}
function makeCard(t){const seed=(Math.random()*2**31)|0;const d=DMAP[t.dest];const R=mulberry(seed^0x5bd1);
  const withF=t.friend&&Math.random()<.75;let line=pick(d.lines);if(withF)line+=pick(FRIENDS[t.friend].trip);
  return {dest:t.dest,seed,date:dateStr(),line,pose:poseFor(t.dest,R),friend:withF?t.friend:null}}
function pickTripFriend(){const ids=Object.keys(S.friends).filter(k=>S.friends[k]>=1);if(!ids.length||Math.random()>.5)return null;return ids[wpick(ids.map(k=>S.friends[k]))]}
function process(){
  let changed=false,guard=0;
  while(guard++<50){
    if(S.status==='home'&&S.bag.food&&S.g>=S.readyAt){S.status='leaving';S.leaveReal=Date.now()+5200;changed=true;continue}
    if(S.status==='leaving'&&Date.now()>=S.leaveReal){
      const bag=S.bag,dest=chooseDest(bag),tier=ITEMS[bag.food].tier,[a,b]=DUR[tier-1],len=rnd(a,b);
      const n=1+(bag.charm==='bell'?1:0)+(Math.random()<.35?1:0);
      const cardsAt=Array.from({length:n},(_,i)=>S.g+len*(0.25+0.6*(i+Math.random()*.6)/n)).sort((x,y)=>x-y);
      S.trip={dest,start:S.g,end:S.g+len,cardsAt,bag:{...bag},friend:pickTripFriend()};S.bag={food:null,charm:null,tool:null};S.status='away';changed=true;continue}
    if(S.status==='away'){
      const t=S.trip;
      if(t.cardsAt.length&&S.g>=t.cardsAt[0]){t.cardsAt.shift();const c=makeCard(t);S.cards.push(c);S.unread.push(c.seed);S.seenAlbum=false;toast('信箱里有一张新的明信片');sfx('mail');changed=true;continue}
      if(S.g>=t.end){
        while(t.cardsAt.length){t.cardsAt.shift();const c=makeCard(t);S.cards.push(c);S.unread.push(c.seed)}
        const extra=t.bag.charm==='amulet'&&Math.random()<.4?1:0;const coins=Math.round(rnd(4,10)*ITEMS[t.bag.food].tier);
        const got=[];for(let i=0;i<1+extra;i++){const k=t.dest+':'+wpick(SV_W);S.souv[k]=(S.souv[k]||0)+1;got.push(k)}
        S.coins+=coins;S.tickets=(S.tickets||0)+1;S.trips++;
        S.events.push({dest:t.dest,coins,got,friend:t.friend});S.trip=null;S.status='home';S.backAt=S.g;S.readyAt=S.g+rnd(60,140);changed=true;continue}
    }
    break;
  }
  const p=S.picnic;if(p.state==='waiting'&&S.g>=p.at){p.state='visiting';changed=true;beachDirty=true;toast(`${FRIENDS[p.friend].name}来海滩做客了`);sfx('pop')}
  S.spots.forEach(sp=>{if(!sp.s&&S.g>=sp.next){sp.s=rollShell();changed=true;beachDirty=true}});
  if(S.g>=S.actAt){S.act=(S.act+1)%DAY_ACTS.length;S.actAt=S.g+rnd(50,90);if(tab==='home'&&S.status==='home')homeDirty=true}
  return changed;
}
function curAct(){if(isNight())return 'sleep';return DAY_ACTS[S.act%DAY_ACTS.length]}

/* ---------- views ---------- */
let tab='home',beachDirty=true,homeDirty=false,bubbleT=null;
const TABS=[['beach','海滩'],['home','小屋'],['shop','商店'],['album','相册'],['treasure','宝物']];

$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sfx('tap');tab=b.dataset.tab;if(tab==='album')S.seenAlbum=true;beachDirty=true;render();window.scrollTo(0,0)});

   (p.state==='visiting'?`<button class="guest" id="guest" aria-label="和${FRIENDS[p.friend].name}说话">${frImg(p.friend)}<span class="ex">!</span></button>`:'');

}
function openPicnic(){

   ${owned.map(id=>`<button data-id="${id}">${seal(id,38)}<span><b>${ITEMS[id].name}</b> ×${S.inv[id]}<small>${foodHint(id)}</small></span></button>`).join('')||'<div class="empty-state">仓库里没有食物，去商店买一点吧。</div>'}
   </div><div class="row"><button class="btn ghost" data-act="close">关闭</button></div>`,el=>{

function foodHint(id){const k=Object.keys(FRIENDS).find(k=>FRIENDS[k].food===id);if(!k)return '香甜的气味会飘得很远……';return S.friends[k]!=null?`${FRIENDS[k].name}最喜欢这个`:'好像有谁很喜欢这个……'}
function talkGuest(){
  const p=S.picnic;if(p.state!=='visiting')return;const id=p.friend,f=FRIENDS[id];const first=S.friends[id]==null;
  S.friends[id]=(S.friends[id]||0)+1;const lv=S.friends[id];
  const tk=Math.random()<.35;const coins=Math.round(rnd(6,16));if(tk)S.tickets=(S.tickets||0)+1;else S.coins+=coins;

   <p class="letter">「${pick(f.hi)}」</p><p class="tip">回礼：${tk?'福引券 ×1':`${coins} 枚贝壳`}${first?`<br>以后${f.name}可能会和${NAME}一起去旅行。`:''}</p>
   <div class="row"><button class="btn" data-a="c">挥挥手</button></div>`,el=>{el.querySelector('[data-a=c]').onclick=()=>{closeModal();beachDirty=true;render()}});

function statusText(){
  if(S.status==='away'){const el=S.g-S.trip.start;return [`${NAME}出门旅行了`,`已经出发 ${fmt(el)}，不知道去了哪里`]}
  if(S.status==='leaving')return ['出发啦！','背上小背包，戴好草帽'];
  if(S.backAt>=0&&S.g-S.backAt<25)return ['旅行回来了！','晒黑了一点点（并没有）'];
  if(S.bag.food&&S.g<S.readyAt)return S.readyAt-S.g<12?['在检查行李','马上就要出发了……']:['旅行回来，正在休息',`看到行李了，${fmt(S.readyAt-S.g)}后会想出门`];
  if(S.bag.food)return ['盯着行李看','好像很想出门……'];
  const a=ACTS[curAct()];return [a.st,isNight()?'夜深了，小屋里只剩下呼吸声':a.sub];
}
function homePose(){
  if(S.status==='away')return null;
  if(S.status==='leaving')return Date.now()<S.leaveReal-2900?'pack':'back';
  if((S.backAt>=0&&S.g-S.backAt<25)||S.bag.food)return 'pack';
  return curAct();
}
function fishBox(pose){const P=POSE[pose];const [x,y]=ROOM_AT[pose];const h=ROOM_H*(P.h/1100)*P.s;return {x,y,h,cx:P.cx}}
let shownPose=null,walkT=null;
function renderHome(v){
  const away=S.status==='away',leaving=S.status==='leaving',lock=away||leaving;
  const [st,sub]=statusText();const pose=homePose();shownPose=pose;
  let fishHTML='';
  if(pose){const b=fishBox(pose);
    fishHTML=`<div class="shadow" style="left:${b.x}%;top:${b.y-1}%;width:${b.h*.5}%"></div><div class="fish ${pose==='pack'?'wave':''}" id="fish" role="button" tabindex="0" aria-label="和${NAME}说话" style="left:${b.x}%;top:${b.y-b.h}%;height:${b.h}%;transform:translateX(-${b.cx*100}%)"><div class="breath"><img src="${IMG_SRC['fish_'+pose]}" alt="${NAME}"></div></div>`}
  v.innerHTML=`<div class="caption"><b id="st">${st}</b><span id="sub">${sub}</span></div>
  <div class="panel room" id="room" style="background-image:url(${IMG_SRC.bg_room})">
   ${away?`<div class="note">出门了～<br>— ${NAME}</div>`:''}
   ${fishHTML}
   ${isNight()?'<div class="night"></div><div class="glow"></div>':''}
   <button class="mailbox" id="mail" ${S.unread.length?'':'hidden'}>信箱 · ${S.unread.length}</button></div>
  <h2 class="sec-title">旅行背包</h2>
  <div class="bag">${['food','charm','tool'].map(c=>{const id=S.bag[c];return `<button class="slot ${id?'filled':''}" data-c="${c}" ${lock?'disabled':''}>
    <span class="lbl">${CATS[c]}</span>${id?seal(id):`<span class="seal ghost">＋</span>`}<span class="nm">${id?ITEMS[id].name:(c==='food'?'必须带':'可不带')}</span></button>`}).join('')}</div>
  <p class="tip">${lock?'旅途中背包锁住了，等她回来再整理吧。':'点格子从仓库里挑选。去哪里由她自己决定，但带的东西会影响目的地。'}</p>`;
  v.querySelectorAll('.slot').forEach(b=>b.onclick=()=>openPicker(b.dataset.c));
  const fish=$('#fish');
  if(fish){const talk=()=>{if(S.status!=='home')return;sfx('pop');fish.classList.remove('hop');void fish.offsetWidth;fish.classList.add('hop');
      const line=S.bag.food?'行李收拾好了，我等一下就出发～':(S.backAt>=0&&S.g-S.backAt<25)?'我回来啦！路上有好多好玩的事！':pick(ACTS[curAct()].lines);showBubble(line)};
    fish.onclick=talk;fish.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')talk()}}
  if(leaving&&pose==='pack'){showBubble('我出发啦～',2600);clearTimeout(walkT);
    walkT=setTimeout(()=>{if(S.status==='leaving'&&tab==='home')renderHome($('#view'))},Math.max(0,S.leaveReal-2900-Date.now()))}
  if(leaving&&pose==='back'){const f=$('#fish');const sh=$('#room .shadow');const th=ROOM_H*.7*POSE.back.s*(POSE.back.h/1100);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{f.classList.add('walk');f.style.left='84%';f.style.top=(56-th)+'%';f.style.height=th+'%';f.style.opacity='0';sh&&(sh.style.opacity=0)}))}
  $('#mail').onclick=openMail;
}
function showBubble(text,ms=2600){const r=$('#room');if(!r)return;r.querySelector('.bubble')?.remove();const f=$('#fish');let x=50,y=20;
  if(f){x=parseFloat(f.style.left);y=Math.max(14,parseFloat(f.style.top)+2)}
  const bb=document.createElement('div');bb.className='bubble';bb.textContent=text;bb.style.left=Math.min(70,Math.max(30,x))+'%';bb.style.top=y+'%';r.appendChild(bb);clearTimeout(bubbleT);bubbleT=setTimeout(()=>bb.remove(),ms)}
function updateHome(){const t=statusText();const a=$('#st'),b=$('#sub');if(a){a.textContent=t[0];b.textContent=t[1]}
  if(S.status==='home'&&homePose()!==shownPose)renderHome($('#view'))}
function openPicker(cat){
  const cur=S.bag[cat];const owned=Object.keys(ITEMS).filter(id=>ITEMS[id].cat===cat&&(S.inv[id]||0)>0);
  modal(`<h3>放入${CATS[cat]}</h3><div class="pick">
   ${owned.map(id=>`<button data-id="${id}">${seal(id,38)}<span><b>${ITEMS[id].name}</b> ×${S.inv[id]}<small>${ITEMS[id].desc}</small></span></button>`).join('')||'<div class="empty-state">仓库里没有这一类东西，去商店看看吧。</div>'}
   </div><div class="row">${cur?'<button class="btn ghost" data-act="rm">取出来</button>':''}<button class="btn ghost" data-act="close">关闭</button></div>`,el=>{
    el.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{if(cur)S.inv[cur]=(S.inv[cur]||0)+1;S.bag[cat]=b.dataset.id;S.inv[b.dataset.id]--;if(cat==='food'&&S.readyAt<=S.g)S.readyAt=S.g+8;sfx('pop');closeModal();save();render()});
    el.querySelector('[data-act=rm]')?.addEventListener('click',()=>{S.inv[cur]=(S.inv[cur]||0)+1;S.bag[cat]=null;closeModal();save();render()});
    el.querySelector('[data-act=close]').onclick=closeModal;});
}
function renderShop(v){
  v.innerHTML=`<div class="caption"><b>海边杂货铺</b><span>买好的东西放进仓库</span></div>
  <div class="lotto"><div class="drum"><svg viewBox="0 0 120 110" style="position:absolute;inset:0" aria-hidden="true"><path d="M30 92 44 50h32l14 42z" fill="#c98d5e" stroke="#1f3468" stroke-width="3" stroke-linejoin="round"/><rect x="18" y="90" width="84" height="10" rx="4" fill="#9d6b4a" stroke="#1f3468" stroke-width="3"/><path d="M84 84h26v8H84z" fill="#fff" stroke="#1f3468" stroke-width="2.5"/></svg><div class="wheel" id="wheel">${DRUM_SVG}</div><span class="ball" id="ball"></span></div>
   <div><h3>海风福引</h3><p>每次旅行回来都会带回一张福引券。<br>手里有 <b id="tk">${S.tickets||0}</b> 张</p><button class="buy" id="spin" ${(S.tickets||0)<1?'disabled':''}>${ticketSVG} 转一次</button></div></div>
  <div class="shop">`+
  ['food','charm','tool'].map(c=>`<div class="cat">${CATS[c]}</div>`+Object.entries(ITEMS).filter(([,i])=>i.cat===c).map(([id,i])=>`
   <div class="item">${seal(id)}<div style="min-width:0"><div class="t">${i.name}<em>仓库 ${S.inv[id]||0}</em></div><p>${i.desc}</p></div>
   <button class="buy" data-id="${id}" ${S.coins<i.price?'disabled':''} aria-label="花 ${i.price} 枚贝壳购买${i.name}">${shellSVG('n')}${i.price}</button></div>`).join('')).join('')+`</div>`;
  v.querySelectorAll('.buy[data-id]').forEach(b=>b.onclick=()=>{const it=ITEMS[b.dataset.id];if(S.coins<it.price)return;S.coins-=it.price;S.inv[b.dataset.id]=(S.inv[b.dataset.id]||0)+1;sfx('coin');toast(`买到了${it.name}`);save();render()});
  $('#spin').onclick=spinLotto;
}
const PRIZES=[
 {w:3,c:'#f6d47a',name:'金球',give:()=>{S.inv.pudding=(S.inv.pudding||0)+1;S.coins+=50;return '星星布丁 ×1 和 50 枚贝壳！'}},
 {w:12,c:'#ee8691',name:'红球',give:()=>{const id=pick(['amulet','bell','cloud','umbrella','lantern','goggles']);S.inv[id]=(S.inv[id]||0)+1;return `${ITEMS[id].name} ×1`}},
 {w:30,c:'#7fb3e6',name:'蓝球',give:()=>{const id=pick(['bento','tea']);S.inv[id]=(S.inv[id]||0)+1;return `${ITEMS[id].name} ×1`}},
 {w:55,c:'#ffffff',name:'白球',give:()=>{S.coins+=10;return '10 枚贝壳'}},
];
let spinning=false;
function spinLotto(){
  if(spinning||(S.tickets||0)<1)return;spinning=true;S.tickets--;save();$('#spin').disabled=true;$('#tk').textContent=S.tickets;
  const p=PRIZES[wpick(PRIZES.map(p=>p.w))];sfx('rattle');
  const w=$('#wheel');w.style.transform=`rotate(${720+Math.random()*90}deg)`;
  setTimeout(()=>{const b=$('#ball');if(b){b.style.background=p.c;b.classList.add('out')}sfx(p.name==='金球'?'fanfare':'coin')},1500);
  setTimeout(()=>{const msg=p.give();save();spinning=false;
    modal(`<h3>${p.name==='金球'?'大当たり！金球！':`转出了${p.name}`}</h3><div class="gift"><span style="width:64px;height:64px;border-radius:50%;background:${p.c};border:3px solid var(--navy);flex:none;box-shadow:inset -8px -8px 0 rgba(0,0,0,.08)"></span><div><b>${msg}</b><br><span style="color:var(--muted);font-size:13px">已经放进仓库啦。</span></div></div><div class="row"><button class="btn" data-a="c">好耶</button></div>`,
    el=>{el.querySelector('[data-a=c]').onclick=()=>{closeModal();render()}})},2300);
}
function renderAlbum(v){
  const cards=[...S.cards].reverse();
  v.innerHTML=`<div class="caption"><b>明信片相册</b><span>${S.cards.length} 张</span></div>`+(cards.length?`<div class="album">${cards.map((c,i)=>`<button class="card-thumb" data-seed="${c.seed}" style="--r:${(i%3-1)*1.4}deg"><img alt="${DMAP[c.dest].name}的明信片" data-seed="${c.seed}">${S.unread.includes(c.seed)?'<span class="new">新</span>':''}${c.friend?`<span class="fr">${frImg(c.friend)}</span>`:''}</button>`).join('')}</div>`
   :`<div class="empty-state">还没有收到明信片。<br>帮${NAME}打包一份便当，她旅行时会寄回来。</div>`);
  const imgs=[...v.querySelectorAll('img[data-seed]')];let i=0;
  ready.then(()=>{const step=()=>{if(i>=imgs.length||tab!=='album')return;const img=imgs[i++];const c=S.cards.find(x=>x.seed==img.dataset.seed);img.src=paintCard(c);setTimeout(step,16)};step()});
  v.querySelectorAll('.card-thumb').forEach(b=>b.onclick=()=>showCard(S.cards.find(x=>x.seed==b.dataset.seed)));
}
function renderTreasure(v){
  const found=DESTS.filter(d=>[0,1,2].some(i=>S.souv[d.id+':'+i])).length;
  const nsv=Object.keys(S.souv).length;
  v.innerHTML=`<div class="caption"><b>宝物架</b><span>去过 ${found} / ${DESTS.length} 个地方</span></div>
  <div class="stats"><div class="stat"><b>${S.trips}</b><span>次旅行</span></div><div class="stat"><b>${S.cards.length}</b><span>张明信片</span></div><div class="stat"><b>${nsv}<small style="font-size:13px">/27</small></b><span>种纪念品</span></div><div class="stat"><b>${Object.keys(S.friends).length}</b><span>位朋友</span></div></div>
  <h2 class="sec-title">海边的朋友</h2>
  <div class="friends">${Object.entries(FRIENDS).map(([id,f])=>S.friends[id]!=null?`<div class="friend">${frImg(id)}<b>${f.name}</b><span class="hearts">${'♥'.repeat(Math.min(5,S.friends[id]))}</span><span>${f.kind} · 爱吃${ITEMS[f.food].name}</span></div>`
    :`<div class="friend unknown">${frImg(id)}<b>？？？</b><span>在野餐垫上放${ITEMS[f.food].name}试试</span></div>`).join('')}</div>
  <h2 class="sec-title">纪念品</h2>
  <div class="list">${DESTS.map(d=>{const been=[0,1,2].some(i=>S.souv[d.id+':'+i]);
    return `<div class="dest-row"><div class="dn">${been?d.name:'？？？'}<small>${been?'':d.req?`也许需要${ITEMS[d.req].name}`:d.tier>1?'需要更好的便当':'还没去过'}</small></div>${[0,1,2].map(i=>{const k=d.id+':'+i,n=S.souv[k];
      return n?`<div class="tr" title="${d.sv[i][1]}">${svSVG(k)}<b>${d.sv[i][0]}</b><span>×${n}${i===2?' · 稀有':''}</span></div>`:`<div class="tr locked">${svSVG(k)}<b>？？？</b><span>${i===2?'稀有':'　'}</span></div>`}).join('')}</div>`}).join('')}</div>`;
}

/* ---------- modal ---------- */
let modalOpen=false;
function modal(html,bind){modalOpen=true;$('#modalRoot').innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const el=$('#modalRoot .sheet');$('#modalRoot .scrim').onclick=e=>{if(e.target.classList.contains('scrim'))closeModal()};bind&&bind(el);el.querySelector('button')?.focus({preventScroll:true})}
function closeModal(){modalOpen=false;$('#modalRoot').innerHTML='';setTimeout(flushEvents,300)}
function showCard(c,next){
  S.unread=S.unread.filter(s=>s!==c.seed);save();const d=DMAP[c.dest];
  ready.then(()=>{modal(`<h3>来自${d.name}</h3>
   <div class="flip" id="flip" role="button" tabindex="0" aria-label="翻面"><div class="inner"><div class="face"><img src="${paintCard(c)}" alt="${d.name}的明信片"></div>
    <div class="face rear"><div class="msg">${c.line}<span class="sign">—— ${NAME}</span></div><div class="side"><div class="stamp">${svSVG(c.dest+':0')}</div><div class="addr">寄给：海边小屋的<br>主人 收<br>${c.date}</div></div></div></div></div>
   <p class="fliphint">点一下明信片可以翻到背面</p>
   <div class="row">${next?`<button class="btn" data-a="n">下一张 (${S.unread.length})</button>`:''}<button class="btn ${next?'ghost':''}" data-a="c">收好</button></div>`,el=>{
    const f=el.querySelector('#flip');const tg=()=>{f.classList.toggle('back');sfx('tap')};f.onclick=tg;f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}};
    el.querySelector('[data-a=c]').onclick=()=>{closeModal();render()};el.querySelector('[data-a=n]')?.addEventListener('click',()=>{closeModal();openMail()})})});
}
function openMail(){if(!S.unread.length)return;sfx('mail');const c=S.cards.find(x=>x.seed===S.unread[0]);showCard(c,S.unread.length>1)}
function flushEvents(){
  if(modalOpen)return;
  if(!S.intro){S.intro=true;save();modal(`<div class="hero"><img src="${IMG_SRC.fish_pack}" alt=""></div><h3>你好，主人！</h3><p class="letter">我是${NAME}，是住在这间海边小屋的鲸鱼女仆。<br>帮我在背包里放一份便当，我就会出门旅行，<br>路上会给你寄明信片哦～</p><div class="row"><button class="btn" data-a="c">请多指教</button></div>`,el=>{el.querySelector('[data-a=c]').onclick=()=>{S.sound=true;save();paintSound();syncBgm();closeModal()}});return}
  if(!S.events.length)return;const e=S.events.shift();save();const d=DMAP[e.dest];sfx('fanfare');
  modal(`<div class="hero"><img src="${IMG_SRC.fish_pack}" alt="" style="height:120px"></div><h3>${NAME}回来了！</h3>${e.got.map(k=>{const i=+k.split(':')[1];return `<div class="gift">${svSVG(k)}<div><b>${d.sv[i][0]}</b>${i===2?' <span style="color:#b8505c;font-size:12px">稀有！</span>':''}<br><span style="color:var(--muted);font-size:13px">${d.sv[i][1]}</span></div></div>`}).join('')}
   <p class="letter">这次去了「${d.name}」${e.friend?`，${FRIENDS[e.friend].name}也一起去了`:''}。路上捡了 ${e.coins} 枚贝壳，都给主人！<br>还带回了一张福引券。</p><div class="row">${S.unread.length?'<button class="btn ghost" data-a="m">看明信片</button>':''}<button class="btn" data-a="c">欢迎回家</button></div>`,el=>{
   el.querySelector('[data-a=c]').onclick=()=>{closeModal();render()};el.querySelector('[data-a=m]')?.addEventListener('click',()=>{modalOpen=false;openMail()})});
  render();
}

/* ---------- speed + sound + loop ---------- */
const SPEEDS=[1,10,60];
function paintSpeed(){const b=$('#speed');b.textContent=`×${S.speed}`;b.classList.toggle('on',S.speed>1)}
function paintSound(){const b=$('#sound');b.textContent=S.sound?'♪ 开':'♪ 关';b.classList.toggle('on',S.sound)}
$('#speed').onclick=()=>{S.speed=SPEEDS[(SPEEDS.indexOf(S.speed)+1)%SPEEDS.length];paintSpeed();toast(S.speed>1?`时间流速 ×${S.speed}，适合心急的主人`:'恢复正常的时间流速');save()};
$('#sound').onclick=()=>{S.sound=!S.sound;paintSound();syncBgm();sfx('pop');save()};
document.addEventListener('pointerdown',()=>{if(S&&S.sound){ac();syncBgm()}},{once:true});
let lastNight=null;
function tick(){
  const now=Date.now();let dt=(now-S.lastReal)/1000;S.lastReal=now;dt=Math.min(Math.max(dt,0),43200);S.g+=dt*S.speed;
  const prevStatus=S.status;const ch=process();
  const n=isNight();if(lastNight!==null&&n!==lastNight&&tab==='home')homeDirty=true;lastNight=n;
  if(ch){$('#coins').textContent=S.coins;if(tab==='home'&&S.status!==prevStatus)render();else renderTabs();if(tab==='beach')updateBeach();if(tab==='home'){const m=$('#mail');if(m){m.hidden=!S.unread.length;m.textContent=`信箱 · ${S.unread.length}`}}save()}
  if(tab==='home'){if(homeDirty){homeDirty=false;renderHome($('#view'))}else updateHome()}
  flushEvents();
}
const ready=Promise.all([imgReady,frReady,document.fonts?Promise.all([document.fonts.load('20px "ZCOOL KuaiLe"'),document.fonts.load('11px "Noto Sans SC"')]).catch(()=>{}):Promise.resolve()]);
let started=false;
function start(data){
  S=(data&&data.S)||load()||freshState();
  if(!S.lastReal)S.lastReal=Date.now();
  paintSpeed();paintSound();
  render();if(!started){started=true;tick();setInterval(tick,500)}
}
window.claude?.hot?.snapshot?.(()=>({S}));
imgReady.then(()=>{window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {})});
</script>
</body>
</html>
