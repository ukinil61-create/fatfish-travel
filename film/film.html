<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script src="../game/friends.js"></script>
<script>
/* Deterministic film renderer: renderFrame(t) paints the frame at time t (seconds). Driven by render.js. */
const MODE=new URLSearchParams(location.search).get('mode')||'h';
const W=MODE==='h'?1920:1080,H=MODE==='h'?1080:1920,V=MODE==='v';
const U=Math.min(W,H)/1080;
const cv=document.getElementById('c');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
ctx.imageSmoothingQuality='high';
const OFF=document.createElement('canvas');OFF.width=W;OFF.height=H;const octx=OFF.getContext('2d');octx.imageSmoothingQuality='high';

/* ---------- assets ---------- */
const BGK=['room','beach','beach_star','lighthouse','shrine','coral','forest','onsen','station','library','fjord','fjord_notail'];
const POSES=['read','sleep','eat','sew','write','clean','pack','back','look'];
const BG={},FISH={},FRI={},CARD=[];let POSE=null,TAIL=null,TAILM=null;
function loadImg(src){return new Promise((r,j)=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>j(new Error('load '+src));im.src=src})}
const GP={};
async function gpFrame(i){i=Math.max(0,Math.min(GP_N-1,Math.round(i)));if(GP[i])return GP[i];const im=await loadImg(`gp/${String(i).padStart(5,'0')}.jpg`);GP[i]=im;
  const ks=Object.keys(GP);if(ks.length>40)delete GP[ks[0]];return im}
const GP_N=1460;
window.filmReady=(async()=>{
  POSE=await (await fetch('../art/pose_meta.json')).json();TAILM=await (await fetch('../art/bg/fjord_tail.json')).json();TAIL=await loadImg('../art/bg/fjord_tail.png');
  await Promise.all([...BGK.map(async k=>BG[k]=await loadImg(`../art/bg/bg_${k}.png`)),
    ...POSES.map(async k=>FISH[k]=await loadImg(`../art/fish_${k}.png`)),
    ...Object.entries(FR_SVG).map(async([k,s])=>FRI[k]=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s.replace('<svg ','<svg width="600" height="550" ')))),
    ...['beach','lighthouse','shrine','coral','forest','onsen','station','library','fjord'].map(async(k,i)=>CARD[i]=await loadImg(`cards/card_${i}_${k}.jpg`))]);
  await document.fonts.load('80px "ZCOOL KuaiLe"');await document.fonts.load('900 40px "Noto Sans SC"');await document.fonts.load('500 40px "Noto Sans SC"');
  makeGrain();buildShots();return true})();

/* ---------- utils ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
const sm=(a,b,t)=>{t=clamp((t-a)/(b-a));return t*t*(3-2*t)};
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function glow(c,x,y,r,col){if(r<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
function star4(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.moveTo(x,y-r);c.quadraticCurveTo(x,y,x+r,y);c.quadraticCurveTo(x,y,x,y+r);c.quadraticCurveTo(x,y,x-r,y);c.quadraticCurveTo(x,y,x,y-r);c.fill()}

/* ---------- lit sprites (cached at native res) ---------- */
const SPR=new Map();
function litSprite(img,L,flip,key){
  const k=key+'|'+JSON.stringify(L)+'|'+flip;if(SPR.has(k))return SPR.get(k);
  const w=img.naturalWidth,h=img.naturalHeight;const c0=document.createElement('canvas');c0.width=w;c0.height=h;const c=c0.getContext('2d');
  if(flip){c.translate(w,0);c.scale(-1,1)}c.drawImage(img,0,0);c.setTransform(1,0,0,1,0,0);
  if(L.a>0){c.globalCompositeOperation='multiply';c.globalAlpha=Math.min(1,L.a*1.6);c.fillStyle=L.tint;c.fillRect(0,0,w,h);c.globalAlpha=1;
    c.globalCompositeOperation='destination-in';if(flip){c.translate(w,0);c.scale(-1,1)}c.drawImage(img,0,0);c.setTransform(1,0,0,1,0,0)}
  if(L.rimA>0){const r0=document.createElement('canvas');r0.width=w;r0.height=h;const r=r0.getContext('2d');const dx=Math.max(4,w*.018)*(L.dir||1);
    r.drawImage(c0,0,0);r.globalCompositeOperation='source-in';r.fillStyle=L.rim;r.fillRect(0,0,w,h);r.globalCompositeOperation='destination-out';r.drawImage(c0,-dx,dx*.3);
    c.globalCompositeOperation='screen';c.globalAlpha=L.rimA;c.drawImage(r0,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over'}
  SPR.set(k,c0);return c0;
}

/* ---------- camera ---------- */
function view(bg,cam){const bw=bg.naturalWidth,bh=bg.naturalHeight;const s=Math.max(W/bw,H/bh)*cam.z;
  const vw=W/s,vh=H/s;let ox=cam.x*bw-vw/2,oy=cam.y*bh-vh/2;ox=clamp(ox,0,bw-vw);oy=clamp(oy,0,bh-vh);return {s,ox,oy,bw,bh,vw,vh}}
const toS=(v,fx,fy,par=0)=>{let x=(fx*v.bw-v.ox)*v.s,y=(fy*v.bh-v.oy)*v.s;x=W/2+(x-W/2)*(1+par);y=H/2+(y-H/2)*(1+par);return [x,y]};
function drawBG(c,bg,v){c.drawImage(bg,v.ox,v.oy,v.vw,v.vh,0,0,W,H)}
function camAt(sh,lt){const p=sh.camEase?sh.camEase(lt/sh.dur):ease(clamp(lt/sh.dur));const a=sh.cam0,b=sh.cam1||sh.cam0;return {x:lerp(a.x,b.x,p),y:lerp(a.y,b.y,p),z:lerp(a.z,b.z,p)}}

/* ---------- characters ---------- */
function drawChar(c,v,ch,t,L,par){
  const P=POSE[ch.pose];const img=FISH[ch.pose];
  let fx=ch.x,fy=ch.y;let hScale=1,alpha=1;
  if(ch.walk){const p=clamp((t-ch.walk.t0)/(ch.walk.t1-ch.walk.t0));const e=ch.walk.ease?ch.walk.ease(p):p;fx=lerp(ch.x,ch.walk.x,e);fy=lerp(ch.y,ch.walk.y,e);hScale=lerp(1,ch.walk.s||1,e);if(ch.walk.fade)alpha=1-sm(ch.walk.fade[0],ch.walk.fade[1],t)}
  const hb=ch.h*v.bh*(P.h/1100)*P.s*hScale;const hs=hb*v.s*(1+par*.6);const ws=hs*P.w/P.h;
  const [sx,sy]=toS(v,fx,fy,par);
  const flip=!!ch.flip;const lp=ws*(flip?1-P.cx:P.cx);
  const ph=(ch.phase||0);
  let bx=1,by=1,rot=0,dy=0;
  const br=Math.sin(t*2*Math.PI/3.4+ph);bx=1+.007*br;by=1-.007*br;
  if(ch.anim==='wave'){rot=Math.sin(t*2*Math.PI/1.1+ph)*.026}
  if(ch.anim==='sway'){rot=Math.sin(t*2*Math.PI/3+ph)*.012}
  if(ch.anim==='chew'){const k=Math.abs(Math.sin(t*Math.PI*2.6));by=1-.012*k;bx=1+.008*k}
  if(ch.anim==='sleep'){const k=Math.sin(t*2*Math.PI/4.2+ph);bx=1+.012*k;by=1-.01*k}
  if(ch.anim==='walk'){dy=-Math.abs(Math.sin(t*Math.PI*2.4))*hs*.025;rot=Math.sin(t*Math.PI*2.4)*.018}
  if(ch.anim==='wipe'){rot=Math.sin(t*2*Math.PI*1.6)*.014}
  if(ch.anim==='hop'){const k=Math.abs(Math.sin(t*Math.PI*1.3+ph));dy=-k*hs*.06;by=1+.04*(k-.5);bx=1-.03*(k-.5)}
  c.save();c.globalAlpha=alpha;
  // contact shadow
  c.save();c.globalCompositeOperation='multiply';const g=c.createRadialGradient(sx,sy,0,sx,sy,ws*.48);g.addColorStop(0,`rgba(40,30,60,${.42*(ch.shadow??1)})`);g.addColorStop(1,'rgba(40,30,60,0)');c.fillStyle=g;c.beginPath();c.ellipse(sx,sy,ws*.48,hs*.065,0,0,7);c.fill();c.restore();
  if(ch.umbrella)drawUmbrella(c,sx+(flip?-1:1)*ws*.03,sy-hs*.9+dy,Math.min(ws*1.3,hs*1.05),ch.umbrella,'handle');
  c.translate(sx,sy+dy);c.rotate(rot);c.scale(bx,by);
  const spr=litSprite(img,L,flip,ch.pose);
  c.drawImage(spr,-lp,-hs,ws,hs);
  c.setTransform(1,0,0,1,0,0);
  if(ch.umbrella)drawUmbrella(c,sx+(flip?-1:1)*ws*.03,sy-hs*.9+dy,Math.min(ws*1.3,hs*1.05),ch.umbrella,'canopy');
  if(ch.anim==='sleep'&&ch.zzz!==false){for(let i=0;i<3;i++){const p=((t*.45+i/3)%1);c.globalAlpha=alpha*Math.sin(p*Math.PI)*.9;c.fillStyle='#ffffff';c.strokeStyle='rgba(31,52,104,.85)';c.lineWidth=4*U;c.font=`${(24+p*26)*U*(hs/(500*U))**.5}px "ZCOOL KuaiLe"`;
    const zx=sx+(flip?-1:1)*ws*(.05+p*.18)+Math.sin(p*6)*8*U,zy=sy-hs*(.72+p*.45);c.strokeText('z',zx,zy);c.fillText('z',zx,zy)}c.globalAlpha=alpha}
  c.restore();
  return {sx,sy,ws,hs,top:sy-hs+dy};
}
function drawFriend(c,v,f,t,L,par){
  const img=FRI[f.id];const [sx,sy]=toS(v,f.x,f.y,par);const hs=f.h*v.bh*v.s*(1+par*.6);const ws=hs*120/110;
  const k=Math.abs(Math.sin(t*Math.PI*1.25+(f.phase||0)));const dy=-k*hs*.12;
  c.save();c.globalCompositeOperation='multiply';c.fillStyle=`rgba(40,30,60,${.3-.12*k})`;c.beginPath();c.ellipse(sx,sy,ws*.38*(1-.15*k),hs*.07,0,0,7);c.fill();c.restore();
  const key='fr_'+f.id;const spr=litSprite(img,{...L,rimA:L.rimA*.6},!!f.flip,key);
  c.save();c.translate(sx,sy+dy);c.scale(1-.04*(k-.5),1+.05*(k-.5));c.drawImage(spr,-ws/2,-hs*.97,ws,hs);c.restore();
}
function drawUmbrella(c,cx,top,w,col,part){
  c.save();c.lineJoin='round';c.lineCap='round';
  if(part==='handle'){c.strokeStyle='#5a3a2a';c.lineWidth=w*.03;c.beginPath();c.moveTo(cx,top-w*.02);c.lineTo(cx+w*.05,top+w*.42);c.stroke();c.restore();return}
  const h=w*.34;c.beginPath();c.moveTo(cx-w/2,top);c.quadraticCurveTo(cx,top-h*1.5,cx+w/2,top);
  for(let i=4;i>=-4;i--){const x=cx+i*w/8;c.quadraticCurveTo(x+w/16,top+h*.12,x,top)}
  c.closePath();c.fillStyle=col;c.fill();c.strokeStyle='#1f3468';c.lineWidth=w*.022;c.stroke();
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=w*.012;for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(cx,top-h*.98);c.quadraticCurveTo(cx+i*w/10,top-h*.7,cx+i*w/8,top-2);c.stroke()}
  c.fillStyle='#1f3468';c.beginPath();c.arc(cx,top-h*.98,w*.025,0,7);c.fill();c.restore();
}
function drawLantern(c,x,y,s,t){
  const fl=1+.06*Math.sin(t*9)+.04*Math.sin(t*23);
  glow(c,x,y-s*.5,s*3*fl,'rgba(255,214,120,.5)');
  c.save();c.lineWidth=s*.08;c.strokeStyle='#1f3468';c.lineJoin='round';
  c.fillStyle='#d98a3d';c.fillRect(x-s*.42,y-s*1.2,s*.84,s*.16);c.strokeRect(x-s*.42,y-s*1.2,s*.84,s*.16);
  c.fillStyle='#ffe9a8';c.fillRect(x-s*.34,y-s*1.04,s*.68,s*.86);c.strokeRect(x-s*.34,y-s*1.04,s*.68,s*.86);
  c.fillStyle='#d98a3d';c.fillRect(x-s*.42,y-s*.18,s*.84,s*.18);c.strokeRect(x-s*.42,y-s*.18,s*.84,s*.18);
  c.beginPath();c.arc(x,y-s*1.3,s*.2,Math.PI,0);c.stroke();c.restore();
  glow(c,x,y-s*.6,s*.8*fl,'rgba(255,250,220,.9)');
}

/* ---------- particles (screen space, deterministic) ---------- */
function mkParts(seed,n,f){const R=mulberry(seed);return Array.from({length:n},(_,i)=>f(R,i))}
const FX={
 sparkle(c,t,P,front){for(const p of P[front?'f':'b']){const tw=.5+.5*Math.sin(t*p.sp+p.ph);const x=p.x*W+Math.sin(t*.3+p.ph)*10*U,y=p.y*H-t*p.v*U;const yy=((y%H)+H)%H;
   const r=p.r*U*(.6+.6*tw);glow(c,x,yy,r*2.6,`rgba(255,226,160,${.35*tw})`);star4(c,x,yy,r,`rgba(255,248,224,${.5+.5*tw})`)}},
 dusk(c,t,P,front){for(const p of P[front?'f':'b']){const tw=.5+.5*Math.sin(t*p.sp+p.ph);const x=p.x*W+Math.sin(t*.4+p.ph)*20*U,y=p.y*H+Math.cos(t*.5+p.ph)*14*U;
   if(front){glow(c,x,y,p.r*5*U,`rgba(255,220,150,${.45*tw})`);c.fillStyle=`rgba(255,246,210,${.9*tw})`;c.beginPath();c.arc(x,y,p.r*.8*U,0,7);c.fill()}else star4(c,x,p.y*H*.5,p.r*U,`rgba(255,255,255,${.6*tw})`)}},
 rain(c,t,P,front){c.save();c.lineCap='round';for(const p of P[front?'f':'b']){const L=(front?60:30)*U*p.r;const sp=(front?2400:1500)*U;const y=((p.y*H+t*sp)%(H+L))-L;const x=p.x*W*1.15-y*.2;
   c.strokeStyle=front?`rgba(235,245,255,${.5*p.a})`:`rgba(220,235,245,${.4*p.a})`;c.lineWidth=(front?2.6:1.5)*U;c.beginPath();c.moveTo(x,y);c.lineTo(x-L*.2,y+L);c.stroke()}c.restore()},
 bubbles(c,t,P,front){c.save();for(const p of P[front?'f':'b']){const r=p.r*U*(front?1.8:1);const y=(((p.y*H-t*p.v*U*(front?1.6:1))%(H+60))+H+60)%(H+60)-30;const x=p.x*W+Math.sin(t*1.5+p.ph)*12*U;
   c.strokeStyle=`rgba(255,255,255,${front?.75:.55})`;c.lineWidth=(front?3:2)*U;c.beginPath();c.arc(x,y,r,0,7);c.stroke();c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.arc(x-r*.35,y-r*.35,r*.22,0,7);c.fill()}c.restore()},
 fireflies(c,t,P,front){for(const p of P[front?'f':'b']){const tw=Math.max(0,Math.sin(t*p.sp+p.ph));const x=p.x*W+Math.sin(t*.37*p.sp+p.ph)*40*U,y=p.y*H+Math.cos(t*.29*p.sp+p.ph*2)*30*U;const r=p.r*U*(front?1.8:1);
   glow(c,x,y,r*8,`rgba(220,255,120,${.55*tw})`);c.fillStyle=`rgba(251,255,210,${.95*tw})`;c.beginPath();c.arc(x,y,r,0,7);c.fill()}},
 snow(c,t,P,front){for(const p of P[front?'f':'b']){const r=p.r*U*(front?2.2:1);const sp=p.v*U*(front?1.5:1);const y=((p.y*H+t*sp)%(H+40))-20;const x=p.x*W+Math.sin(t*.8+p.ph)*30*U;
   c.fillStyle=`rgba(255,255,255,${front?.8:.9})`;if(front)glow(c,x,y,r*2,'rgba(255,255,255,.5)');c.beginPath();c.arc(x,y,r,0,7);c.fill()}},
 pages(c,t,P,front){for(const p of P[front?'f':'b']){const s=p.r*U*(front?2:1.1);const x=((p.x*W+t*p.v*U)%(W+200))-100,y=p.y*H+Math.sin(t*1.2+p.ph)*30*U;const flap=Math.sin(t*5+p.ph);
   c.save();c.translate(x,y);c.rotate(Math.sin(t*.7+p.ph)*.2);c.fillStyle='#fffaf0';c.strokeStyle='#8a7fb0';c.lineWidth=1.5*U;c.beginPath();c.moveTo(0,0);c.lineTo(-s*2,-s*flap);c.lineTo(-s*2,s*.3);c.closePath();c.moveTo(0,0);c.lineTo(s*2,-s*flap);c.lineTo(s*2,s*.3);c.closePath();c.fill();c.stroke();c.restore()}
   FX.sparkle(c,t,{f:P.sf,b:P.sb},front)},
 aurora(c,t,P,front){for(const p of P[front?'f':'b']){const tw=.5+.5*Math.sin(t*p.sp+p.ph);const x=p.x*W,y=((p.y*H-t*p.v*U*.5)%H+H)%H;const r=p.r*U*(front?1.6:1);glow(c,x,y,r*5,`rgba(140,255,215,${.32*tw})`);star4(c,x,y,r,`rgba(235,255,250,${.85*tw})`)}},
 dust(c,t,P,front){for(const p of P[front?'f':'b']){const x=p.x*W+Math.sin(t*.25+p.ph)*30*U+t*6*U,y=p.y*H+Math.cos(t*.2+p.ph)*20*U-t*4*U;const tw=.5+.5*Math.sin(t*p.sp+p.ph);
   glow(c,x,y,p.r*3*U,`rgba(255,240,200,${.35*tw})`)}},
 none(){},
};
function partsFor(kind,seed){
  const g=(n,o={})=>mkParts(seed+n,n,(R,i)=>({x:R(),y:R(),r:(o.r0??2)+R()*(o.r1??4),v:(o.v0??20)+R()*(o.v1??40),sp:.8+R()*2.5,ph:R()*7,a:.5+R()*.5}));
  switch(kind){
   case'sparkle':return {b:g(46,{r0:2,r1:5,v0:2,v1:8}),f:g(12,{r0:7,r1:10,v0:6,v1:16})};
   case'dusk':return {b:g(30,{r0:2,r1:4}),f:g(14,{r0:2,r1:3})};
   case'rain':return {b:g(220,{r0:.7,r1:.6}),f:g(70,{r0:.8,r1:.6})};
   case'bubbles':return {b:g(36,{r0:4,r1:10,v0:40,v1:90}),f:g(10,{r0:8,r1:12,v0:60,v1:90})};
   case'fireflies':return {b:g(55,{r0:2,r1:2.5}),f:g(14,{r0:3,r1:3})};
   case'snow':return {b:g(150,{r0:1.4,r1:2.6,v0:40,v1:70}),f:g(36,{r0:3,r1:4,v0:60,v1:90})};
   case'pages':return {b:g(12,{r0:7,r1:5,v0:20,v1:40}),f:g(4,{r0:9,r1:5,v0:30,v1:60}),sb:g(30,{r0:2,r1:4,v0:2,v1:6}),sf:g(8,{r0:5,r1:6,v0:4,v1:10})};
   case'aurora':return {b:g(60,{r0:1.5,r1:3,v0:6,v1:20}),f:g(14,{r0:4,r1:6,v0:10,v1:30})};
   case'dust':return {b:g(40,{r0:3,r1:6}),f:[]};
   default:return {b:[],f:[]};
  }
}

/* ---------- scene-specific animated overlays ---------- */
const SCN={
 room:{L:{tint:'#ffe9d2',a:.06,rim:'#fff1d0',rimA:.35,dir:-1},fx:'dust'},
 beach_star:{L:{tint:'#ffd7c2',a:.22,rim:'#ffbf80',rimA:.55,dir:1},fx:'sparkle'},
 lighthouse:{L:{tint:'#d9c6ff',a:.28,rim:'#ffb38a',rimA:.5,dir:1},fx:'dusk'},
 shrine:{L:{tint:'#c9d6cf',a:.3,rim:'#ffe2b0',rimA:.25,dir:-1},fx:'rain'},
 coral:{L:{tint:'#a8e6f0',a:.3,rim:'#e9ffff',rimA:.45,dir:-1},fx:'bubbles'},
 forest:{L:{tint:'#7f8fc6',a:.52,rim:'#e8ff9a',rimA:.55,dir:1},fx:'fireflies',night:true},
 onsen:{L:{tint:'#dfeaff',a:.16,rim:'#ffffff',rimA:.4,dir:1},fx:'snow'},
 station:{L:{tint:'#a6aee8',a:.38,rim:'#ffb0e6',rimA:.55,dir:-1},fx:'bubbles',night:true},
 library:{L:{tint:'#fff0f6',a:.1,rim:'#fff3d8',rimA:.5,dir:1},fx:'pages'},
 fjord:{L:{tint:'#7f95cc',a:.5,rim:'#8ff6d6',rimA:.65,dir:1},fx:'aurora',night:true},
 fjord_notail:{L:{tint:'#7f95cc',a:.5,rim:'#8ff6d6',rimA:.65,dir:1},fx:'aurora',night:true},
};
function sceneOverlay(c,key,v,t,front){
  if(key==='lighthouse'&&!front){const [lx,ly]=toS(v,.895,.155);const a=Math.sin(t*1.3)*.55-2.9;const len=W*1.4;
    c.save();c.globalCompositeOperation='screen';const g=c.createRadialGradient(lx,ly,0,lx,ly,len);g.addColorStop(0,'rgba(255,240,190,.55)');g.addColorStop(.5,'rgba(255,230,170,.12)');g.addColorStop(1,'rgba(255,230,170,0)');c.fillStyle=g;

  S.push(room({t0:66.5,t1:72.5,cam0:{x:.54,y:.52,z:1.4},cam1:{x:.54,y:.5,z:1.2},fadeIn:.7,chars:[{pose:'sleep',x:.54,y:.66,h:RH,anim:'sleep'}],night:.55,beam:0,grade:{vig:.5},end:{t0:.3,y:.72}}));
  }
  SHOTS=S;
}
window.DUR=MODE==='h'?130:72.5;

/* ---------- frame ---------- */
async function drawShot(c,sh,t){
  if(sh.kind==='scene'){
    // per-character visibility windows
    const save=sh.chars;if(save){sh.chars=save.filter(ch=>!(ch.hideBefore!=null&&t-sh.t0<ch.hideBefore)&&!(ch.walk&&ch.walk.fade&&t-sh.t0>ch.walk.fade[1]))}
    drawScene(c,sh,t);sh.chars=save;
    const lt=t-sh.t0;if(sh.title)titleOverlay(c,lt,sh.title);if(sh.end)endOverlay(c,lt,sh.end);
  } else if(sh.kind==='game')await drawGame(c,sh,t);
  else if(sh.kind==='collage')drawCollage(c,sh,t);
}
window.renderFrame=async function(t){
  const act=SHOTS.filter(s=>t>=s.t0-(s.fadeIn||0)&&t<s.t1);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let i=0;i<act.length;i++){const sh=act[i];const a=sh.fadeIn&&i>0?sm(sh.t0-sh.fadeIn,sh.t0,t):1;
    if(a>=1||i===0){await drawShot(ctx,sh,t)}else{octx.clearRect(0,0,W,H);await drawShot(octx,sh,t);
      if(sh.trans==='wipe'){const band=W*.35,e=ease(a),x0=lerp(-band,W+band*.2,e);octx.save();octx.globalCompositeOperation='destination-in';const g=octx.createLinearGradient(x0-band*.5,0,x0+band*.5,H*.25);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');octx.fillStyle=g;octx.fillRect(0,0,W,H);octx.restore();ctx.drawImage(OFF,0,0)}
      else{ctx.save();ctx.globalAlpha=a;ctx.drawImage(OFF,0,0);ctx.restore()}}}
  // global fades
  const fi=1-sm(0,1.2,t),fo=V?sm(DUR-1.3,DUR-.05,t):sm(DUR-2.4,DUR-.1,t);const k=Math.max(fi,fo);if(k>0){ctx.fillStyle=`rgba(0,0,0,${k})`;ctx.fillRect(0,0,W,H)}
};

    chars:[{pose:'pack',x:V?.5:.66,y:V?.76:.88,h:V?.5:.6,anim:'wave'}],

  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);drawScene(ctx,sh,1.15);

  const cards=[0,4,8];cards.forEach((ci,k)=>{const cw=(V?250:380)*U,chh=cw*2/3;const x=V?W*.76+k*24*U:W*.2+k*60*U,y=V?H*.62+k*16*U:H*.68+k*10*U,r=(-.12+k*.1);
    ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.shadowColor='rgba(40,20,10,.4)';ctx.shadowBlur=28*U;ctx.shadowOffsetY=10*U;ctx.fillStyle='#fff';ctx.fillRect(-cw/2-12*U,-chh/2-12*U,cw+24*U,chh+24*U);ctx.shadowColor='transparent';ctx.drawImage(CARD[ci],-cw/2,-chh/2,cw,chh);ctx.restore()});
  if(V){const y=H*.13;bigText(ctx,'大肥鱼的旅行',W/2,y,150,1,{color:'#fff',stroke:'#1f3468',sw:26,blur:30});
    bigText(ctx,'鲸鱼女仆的放置旅行小游戏',W/2,y+105*U,52,1,{color:'#fff',stroke:'#1f3468',sw:14,blur:16});
    bigText(ctx,'网页即玩',W/2,y+185*U,46,1,{color:'#ee8691',stroke:'#fff',sw:14,glow:false});}
  else{const x=W*.32,y=H*.26;bigText(ctx,'大肥鱼的旅行',x,y,148,1,{color:'#fff',stroke:'#1f3468',sw:28,blur:30});
    bigText(ctx,'鲸鱼女仆的放置旅行小游戏',x,y+100*U,52,1,{color:'#fff',stroke:'#1f3468',sw:14,blur:16});
    ctx.save();const tw=300*U,th=78*U,bx=x-tw/2,by=y+150*U;ctx.fillStyle='#ee8691';roundRect(ctx,bx,by,tw,th,39*U);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=5*U;ctx.stroke();ctx.restore();
    bigText(ctx,'网页即玩 ♪',x,y+150*U+54*U,44,1,{color:'#fff',glow:false})}
  return cv.toDataURL('image/jpeg',.95)};
window.grab=async function(t,q=.93){await renderFrame(t);return cv.toDataURL('image/jpeg',q)};
